<script>
  // 1. クリックで閉じる処理（背景または×ボタン）
  document.querySelectorAll('.modal-close-bg, .modal-close-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      location.hash = 'close';
    });
  });

  // 2. キーボードの「Esc」キーで閉じる処理
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && location.hash.startsWith('#popup-')) {
      location.hash = 'close';
    }
  });
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const images = document.querySelectorAll('main img');

  images.forEach(img => {
    if (img.complete) {
      img.classList.add('img-loaded');
    } else {
      img.addEventListener('load', function() {
        img.classList.add('img-loaded');
      });
    }
  });
});
</script>
